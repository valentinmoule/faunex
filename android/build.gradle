// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.1'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Compatibilité AGP 9.x : proguard-android.txt a été supprimé du SDK.
    // Certains plugins (ex. @capacitor-community/apple-sign-in) y font encore
    // référence via getDefaultProguardFile('proguard-android.txt'), ce qui
    // fait échouer le build release. On remplace durablement la référence
    // manquante par proguard-android-optimize.txt, sans toucher node_modules.
    project.plugins.withId('com.android.library') {
        project.afterEvaluate {
            def release = project.android.buildTypes.findByName('release')
            if (release != null) {
                release.proguardFiles = release.proguardFiles.collect { f ->
                    if (f.name == 'proguard-android.txt' && !f.exists()) {
                        return new File(project.android.sdkDirectory, 'tools/proguard/proguard-android-optimize.txt')
                    }
                    return f
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
